{% load static %}
<!DOCTYPE html>
<html lang="es">
    <head>
        <meta charset="UTF-8">
        <meta name="viewport" content="width=device-width, initial-scale=1.0">

        <!--  FUENTES  -->
        <link rel="preconnect" href="https://fonts.googleapis.com">
        <link href="https://fonts.googleapis.com/css2?family=Sora:wght@600;700;800&family=Roboto:wght@400;500&family=JetBrains+Mono:wght@500&display=swap" rel="stylesheet">

        <!--  CSS  -->
        <link rel="stylesheet" href="{% static 'usuarios/css/login.css' %}">

        <!--  BOX ICONS  -->
        <link href='https://cdn.jsdelivr.net/npm/boxicons@2.0.5/css/boxicons.min.css' rel='stylesheet'>

        <title>Login</title>
    </head>
    <body>

        <!--  AMBIENTE MAP FONDO  -->
        <div class="scene-bg" aria-hidden="true">
            <div class="scene-grid"></div>
            <span class="pulse pulse--a"><i></i></span>
            <span class="pulse pulse--b"><i></i></span>
            <span class="pulse pulse--c"><i></i></span>
        </div>

        <div class="l-form">
            <div class="shape1"></div>
            <div class="shape2"></div>

            <div class="form">

                <!--  RUTA ILUSTRACION  -->
                <div class="form__img" aria-hidden="true">
                    <svg class="route-svg" viewBox="0 0 520 520" fill="none">
                        <path class="route-path" d="M60 460 C 140 460, 120 320, 210 300 S 340 200, 320 120 S 420 60, 460 60"
                              stroke="url(#routeGrad)" stroke-width="4" stroke-linecap="round" stroke-dasharray="10 14"/>
                        <defs>
                            <linearGradient id="routeGrad" x1="0" y1="0" x2="1" y2="1">
                                <stop offset="0%" stop-color="#34D8C4"/>
                                <stop offset="100%" stop-color="#E63950"/>
                            </linearGradient>
                        </defs>

                        <!-- warehouse -->
                        <g transform="translate(30,420)">
                            <rect width="64" height="46" rx="4" fill="#1B2340" stroke="#3A4570" stroke-width="2"/>
                            <path d="M-4 420 32 400 68 420" transform="translate(0,-420)" fill="#232B4D"/>
                            <rect x="26" y="16" width="12" height="20" fill="#0F1428"/>
                        </g>

                        <!-- floating packages -->
                        <g class="pkg pkg--1"><rect x="240" y="250" width="20" height="20" rx="3" fill="#E63950"/></g>
                        <g class="pkg pkg--2"><rect x="360" y="150" width="16" height="16" rx="3" fill="#34D8C4"/></g>
                        <g class="pkg pkg--3"><rect x="150" y="360" width="14" height="14" rx="3" fill="#F2C94C"/></g>

                        <!-- destination pin -->
                        <g class="dest-pin" transform="translate(440,30)">
                            <circle class="ping-ring" cx="20" cy="20" r="10" fill="none" stroke="#E63950" stroke-width="2"/>
                            <path d="M20 2c9.4 0 17 7.4 17 16.6C37 31 20 46 20 46S3 31 3 18.6C3 9.4 10.6 2 20 2z" fill="#E63950"/>
                            <circle cx="20" cy="18" r="6" fill="#0A0F1F"/>
                        </g>
                    </svg>
                </div>

                <form action="" class="form__content" id="loginForm">
                    {% csrf_token %}

                    <div class="form__eyebrow">
                        <span class="form__dot"></span>
                        INPREDISROUTE
                    </div>

                    <h1 class="form__title"> Bienvenido<span class="form__title-accent"></span></h1>
                    <p class="form__subtitle">Tu espacio de trabajo está listo, inicia sesión para ingresar.</p>

                    <div class="form__div form__div-one">
                        <div class="form__icon">
                            <i class='bx bx-user-circle'></i>
                        </div>

                        <div class="form__div-input">
                            <label for="user" class="form__label">Usuario</label>
                            <input type="text" id="user" class="form__input">
                        </div>
                    </div>

                    <div class="form__div">
                        <div class="form__icon">
                            <i class='bx bx-lock' ></i>
                        </div>

                        <div class="form__div-input">
                            <label for="pass" class="form__label">Contraseña</label>
                            <input type="password" id="pass" class="form__input">
                        </div>
                    </div>
                    <br>

                    <p id="errorMsg" class="form__error"></p>

                    <button type="submit" class="form__button">
                        <span>INICIAR SESIÓN</span>
                    </button>

                </form>
            </div>

        </div>

        <!-- CARRO  -->
        <div class="road" aria-hidden="true">
            <div class="road__lines"></div>
            <div class="van">
                <svg viewBox="0 0 120 60" width="100%" height="100%">
                    <ellipse class="van__shadow" cx="58" cy="54" rx="50" ry="5"/>

                    <!-- cargo box -->
                    <rect class="van__box" x="2" y="8" width="64" height="32" rx="3"/>
                    <rect class="van__roof" x="2" y="8" width="64" height="5" rx="2"/>
                    <line class="van__doorline" x1="14" y1="13" x2="14" y2="40"/>

                    <!-- parcel decal -->
                    <rect class="van__parcel-bg" x="30" y="16" width="22" height="18" rx="2"/>
                    <line class="van__parcel-tape" x1="41" y1="16" x2="41" y2="34"/>
                    <line class="van__parcel-tape" x1="30" y1="25" x2="52" y2="25"/>

                    <!-- cab -->
                    <path class="van__glass" d="M66 22 L66 16 Q66 12 70 12 L82 12 L96 22 Z"/>
                    <rect class="van__cabdoor" x="66" y="22" width="26" height="18" rx="2"/>
                    <rect class="van__nose" x="92" y="24" width="14" height="14" rx="2"/>
                    <rect class="van__bumper" x="90" y="36" width="18" height="4" rx="1"/>
                    <rect class="van__mirror" x="94" y="13" width="3" height="6" rx="1"/>
                    <circle class="van__light" cx="103" cy="30" r="2.5"/>

                    <circle class="wheel" cx="22" cy="42" r="9"/>
                    <circle class="wheel" cx="84" cy="42" r="9"/>
                    <circle class="hub" cx="22" cy="42" r="3.2"/>
                    <circle class="hub" cx="84" cy="42" r="3.2"/>
                </svg>
            </div>
        </div>

        <!-- MAIN JS -->

        <script src="{% static 'usuarios/js/login.js' %}"></script>
    </body>
</html>
