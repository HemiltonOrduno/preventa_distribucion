{% extends 'establecimientos/base_vendedor.html' %}

{% block title %}Mis pedidos{% endblock %}
{% block nav_pedidos_d %}active{% endblock %}
{% block nav_pedidos_m %}active{% endblock %}

{% block content %}
<div class="page__eyebrow">
    <i class='bx bx-cart'></i> PEDIDOS DE HOY
</div>

<div class="card" style="background: var(--color-info-bg); box-shadow:none; border:none;">
    <div class="card__row" style="margin-bottom:0;">
        <span style="font-size:12px; color: var(--color-info-text);" id="resumen-texto">
            Cargando...
        </span>
    </div>
</div>

<div id="lista-pedidos"></div>
{% endblock %}

{% block extra_scripts %}
<script>
    fetch('/api/visitas/api/mis-pedidos/')
        .then(r => r.json())
        .then(d => {
            const lista = document.getElementById('lista-pedidos');
            const pedidos = d.pedidos || [];

            if (pedidos.length === 0) {
                document.getElementById('resumen-texto').innerText =
                    'Todavía no has levantado pedidos hoy';
                return;
            }

            const total = pedidos.reduce((s, p) => s + p.total, 0);
            document.getElementById('resumen-texto').innerText =
                `${pedidos.length} pedido(s) · $${total.toFixed(2)} en total`;

            lista.innerHTML = pedidos.map(p => `
                <div class="card">
                    <div class="card__row">
                        <div style="flex:1;">
                            <div style="font-size:14px; font-weight:600;">${p.establecimiento}</div>
                            <div class="card__sub">${p.colonia || ''} · ${p.fecha}</div>
                        </div>
                        <div style="text-align:right;">
                            <div style="font-size:15px; font-weight:700; color:#2e7d32;">
                                $${p.total.toFixed(2)}
                            </div>
                            <div class="card__sub">Pedido #${p.pedido_id}</div>
                        </div>
                    </div>
                    <div class="card__row" style="margin-bottom:0;">
                        <span class="badge">${p.estado}</span>
                        ${p.observaciones
                            ? `<span class="card__sub" style="flex:1;">${p.observaciones}</span>`
                            : ''}
                    </div>
                </div>
            `).join('');
        })
        .catch(() => {
            document.getElementById('resumen-texto').innerText =
                'No se pudieron cargar los pedidos';
        });
</script>
{% endblock %}
